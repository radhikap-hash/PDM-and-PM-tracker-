name: Show all project stages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show future stages as Not Started
        shell: python
        run: |
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* SHOW ALL STAGES - NOT STARTED */'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          patch = '''\n<style>\n/* SHOW ALL STAGES - NOT STARTED */\n/* Keep future stages visible; the dashboard labels them Not Started. */\n.stage-row.live-hidden-stage { display:flex !important; }\n.stage-detail.live-hidden-stage { display:block !important; }\n</style>\n'''
          s = s.replace('</head>', patch + '</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          git commit -m 'Show future stages as Not Started' || exit 0
          git push
