name: Fix stage-based dashboard progress

on:
  push:
    paths:
      - '.github/workflows/fix-stage-progress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch live progress calculation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('dashboard.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* STAGE BASED PROGRESS FIX */'
          if marker in text:
              print('Stage-based progress fix already present')
              raise SystemExit(0)

          # Insert normalization immediately after the live API assigns DATA.
          needle = '    DATA = j;'
          if needle not in text:
              raise SystemExit('Could not find DATA = j; in dashboard.html')

          patch = r'''    DATA = j;

    /* STAGE BASED PROGRESS FIX */
    // Rule: the dashboard progress is determined by the current active
    // stage, not by empty future stages and not by document counts.
    // Example: Stage 6 In Progress => 60%, Stage 5 In Progress => 50%.
    function normalizeStageProgress(){
      const total = Number(TOTAL_STAGES || 10);
      const products = Array.isArray(DATA.products) ? DATA.products : [];
      const engMap = DATA.engineering || {};

      products.forEach(p => {
        const eng = engMap[p.id] || {};
        const stageNums = Object.keys(eng)
          .map(Number)
          .filter(n => Number.isFinite(n) && n >= 1 && n <= total)
          .sort((a,b) => a-b);

        if(!stageNums.length){
          const fallback = Math.max(1, Math.min(total, Number(p.currentStage || p.stage || 1)));
          p.currentStage = fallback;
          p.currentStageName = STAGES[fallback - 1] || ('Stage ' + fallback);
          p.progressPct = Math.round((fallback / total) * 100);
          return;
        }

        const active = stageNums.filter(n => {
          const e = eng[n] || {};
          const ratio = Number(e.completionRatio);
          const totalCount = Number(e.totalCount || 0);
          const completedCount = Number(e.completedCount || 0);
          const status = String(e.status || '').trim().toLowerCase();
          const completed =
            (totalCount > 0 && completedCount >= totalCount) ||
            ratio >= 1 ||
            /completed|complete|closed|approved/.test(status);
          return !completed;
        });

        let current;
        if(active.length){
          // Highest stage with actual non-empty work that is not complete.
          current = Math.max(...active);
        } else {
          // All populated stages are complete: move to the next stage.
          const highest = Math.max(...stageNums);
          current = Math.min(highest + 1, total);
        }

        p.currentStage = current;
        p.currentStageName = STAGES[current - 1] || ('Stage ' + current);

        // Do not let empty stages reduce or inflate the progress.
        // Progress represents the stage currently reached.
        p.progressPct = Math.round((current / total) * 100);
      });
    }

    normalizeStageProgress();'''

          text = text.replace(needle, patch, 1)
          path.write_text(text, encoding='utf-8')
          print('Stage-based progress calculation patched successfully')

      - name: Commit dashboard fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          if git diff --cached --quiet; then
            echo 'No dashboard change needed.'
          else
            git commit -m 'Fix dashboard progress to follow current stage'
            git push
          fi
