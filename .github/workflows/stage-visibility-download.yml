name: Verify dashboard integrity

on:
  push:
    paths:
      - 'dashboard.html'
      - '.github/workflows/stage-visibility-download.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify dashboard structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('dashboard.html').read_text(encoding='utf-8')
          current = 'AKfycbxo59j_9qO_jzoljBlb4ZFrL6RZyXxzOe8c8MCt5wX13DyEKh6ye02N7IcSgky2rOl6'
          old = 'AKfycby2rAwDYj8bzK5Vgyn2PniZBmuOMoarqR6IRttoESPtR6CTDbvgR3fLWeXwWIXvaDeA'
          if current not in text:
              raise SystemExit('Current Apps Script endpoint is missing')
          if old in text:
              raise SystemExit('Old Apps Script endpoint is present')
          if '<!doctype html>' not in text.lower() or '</html>' not in text.lower():
              raise SystemExit('Invalid dashboard HTML structure')
          print('Dashboard integrity check passed.')
          PY
