name: Add stage visibility and download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')

          marker = '/* LIVE STAGE VISIBILITY + DOWNLOAD PATCH */'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)

          css = r'''<style>
          /* LIVE STAGE VISIBILITY + DOWNLOAD PATCH */
          .stage-row.live-hidden-stage,
          .stage-detail.live-hidden-stage { display:none !important; }
          button.lib.download-btn { border-color: var(--teal); }
          </style>'''

          js = r'''<script>
          /* LIVE STAGE VISIBILITY + DOWNLOAD PATCH */
          (function(){
            function hideFutureStages(){
              const rows = Array.from(document.querySelectorAll('.stage-row'));
              if(!rows.length) return;

              rows.forEach((row) => {
                const status = row.querySelector('.stage-status');
                const future = status && status.classList.contains('upcoming');
                const detail = row.nextElementSibling && row.nextElementSibling.classList.contains('stage-detail')
                  ? row.nextElementSibling : null;

                row.classList.toggle('live-hidden-stage', !!future);
                if(detail) detail.classList.toggle('live-hidden-stage', !!future);
              });
            }

            function csvEscape(v){
              if(v === null || v === undefined) return '';
              let x = (typeof v === 'object') ? JSON.stringify(v) : String(v);
              return '"' + x.replace(/"/g, '""') + '"';
            }

            function downloadCSV(){
              const products = Array.isArray(window.DATA && DATA.products) ? DATA.products : [];
              if(!products.length){
                alert('No live project data is available to download.');
                return;
              }

              const preferred = [
                'id','projectId','name','projectName','productName','category','client',
                'owner','pm','pdM','status','progress','progressPct','stage','stageNo',
                'currentStage','currentStageName','blocker','nextStep','plannedStart',
                'dueDate','completedDate'
              ];

              const keys = [];
              for(const k of preferred){
                if(products.some(p => Object.prototype.hasOwnProperty.call(p,k))) keys.push(k);
              }
              for(const p of products){
                for(const k of Object.keys(p)){
                  if(!keys.includes(k)) keys.push(k);
                }
              }

              const rows = [keys.map(csvEscape).join(',')];
              for(const p of products){
                rows.push(keys.map(k => csvEscape(p[k])).join(','));
              }

              const blob = new Blob(['\ufeff' + rows.join('\r\n')], {type:'text/csv;charset=utf-8;'});
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'PDM-PM-Live-Tracker-' + new Date().toISOString().slice(0,10) + '.csv';
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            function addDownloadButton(){
              const bar = document.querySelector('.topbtns');
              if(!bar || document.getElementById('downloadLiveCSV')) return;

              const b = document.createElement('button');
              b.id = 'downloadLiveCSV';
              b.className = 'lib download-btn';
              b.type = 'button';
              b.textContent = 'Download CSV';
              b.title = 'Download the current live Google Sheet data';
              b.addEventListener('click', downloadCSV);
              bar.appendChild(b);
            }

            function apply(){
              addDownloadButton();
              hideFutureStages();
            }

            window.addEventListener('load', apply);
            setInterval(apply, 1000);
          })();
          </script>'''

          if '</head>' not in s or '</body>' not in s:
              raise SystemExit('dashboard.html does not have expected HTML structure')

          s = s.replace('</head>', css + '\n</head>', 1)
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('Dashboard patched')

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          git commit -m 'Show only completed/current stages and add CSV download' || exit 0
          git push
