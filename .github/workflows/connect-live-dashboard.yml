name: Keep live dashboard connector stable

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify dashboard uses the current Apps Script endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('dashboard.html').read_text(encoding='utf-8')
          current = 'AKfycbxo59j_9qO_jzoljBlb4ZFrL6RZyXxzOe8c8MCt5wX13DyEKh6ye02N7IcSgky2rOl6'
          old = 'AKfycby2rAwDYj8bzK5Vgyn2PniZBmuOMoarqR6IRttoESPtR6CTDbvgR3fLWeXwWIXvaDeA'

          if current not in text:
              raise SystemExit('ERROR: current Apps Script endpoint is missing from dashboard.html')
          if old in text:
              raise SystemExit('ERROR: old Apps Script endpoint is still present in dashboard.html')

          if text.count('LIVE_API_URL') > 1:
              raise SystemExit('ERROR: multiple live connectors detected')

          print('Dashboard connector check passed.')
          print('Exactly one live Apps Script endpoint is configured.')
          PY
