name: Apply Documents sheet as dashboard document source

on:
  push:
    paths:
      - '.github/workflows/apply-documents-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Apps Script source and dashboard
        shell: python
        run: |
          from pathlib import Path

          cp = Path('apps-script/Code.gs')
          code = cp.read_text(encoding='utf-8')

          if 'const DOCUMENT_SOURCE_SHEET_NAMES' not in code:
              code = code.replace(
                  "const OWNER_SHEET_NAMES = [",
                  "const DOCUMENT_SOURCE_SHEET_NAMES = ['Documents'];\n\nconst OWNER_SHEET_NAMES = [",
                  1
              )

          if 'function readDocumentsSheet_' not in code:
              fn = r'''
/* ============================================================
   DOCUMENTS SHEET — AUTHORITATIVE DOCUMENT SOURCE
   ============================================================ */
function readDocumentsSheet_(ss, stages, products, warnings) {
  const sheet = findSheet_(ss, DOCUMENT_SOURCE_SHEET_NAMES);
  if (!sheet) {
    warnings.push('Documents sheet not found. Expected a tab named "Documents". Owner-tab documents remain in use.');
    return { found: false, documents: {} };
  }

  const values = sheet.getDataRange().getValues();
  if (!values.length) return { found: true, documents: {} };

  let headerIdx = -1;
  for (let r = 0; r < Math.min(values.length, 10); r++) {
    const row = values[r];
    const hasDoc = findCol_(row, ['document name', 'document names', 'document', 'file name']) !== -1;
    const hasProject = findCol_(row, ['project id', 'project', 'product id', 'variant id', 'id']) !== -1;
    const hasStage = findCol_(row, ['stage #', 'stage no', 'stage number', 'stage name', 'stage']) !== -1;
    if (hasDoc && (hasProject || hasStage)) { headerIdx = r; break; }
  }

  if (headerIdx === -1) {
    warnings.push('Documents sheet found, but its header row could not be identified. Expected Project ID, Stage/Stage #, Document Name and optionally Document Link.');
    return { found: true, documents: {} };
  }

  const header = values[headerIdx];
  const colId = findCol_(header, ['project id', 'product id', 'variant id', 'project', 'id']);
  const colName = findCol_(header, ['product / solution name', 'solution name', 'product name', 'variant name']);
  const colStageNum = findCol_(header, ['stage #', 'stage no', 'stage number']);
  const colStage = findCol_(header, ['stage name', 'stage', 'activity']);
  const colDoc = findCol_(header, ['document name', 'document names', 'file name', 'document']);
  const colLink = findCol_(header, ['document link', 'file link', 'drive link', 'url', 'link']);
  const colStatus = findCol_(header, ['status', 'document status']);
  const colStart = findCol_(header, ['planned start', 'start date']);
  const colDue = findCol_(header, ['due date', 'deadline']);
  const colCompleted = findCol_(header, ['completed date', 'completion date']);

  if (colDoc === -1) {
    warnings.push('Documents sheet does not contain a Document Name column.');
    return { found: true, documents: {} };
  }

  const knownIds = products.map(p => p.id);
  const nameToId = {};
  products.forEach(p => { nameToId[normName_(p.name)] = p.id; });

  const stageNameToNum = {};
  stages.forEach((s, i) => { stageNameToNum[norm_(s)] = i + 1; });

  function resolveStage_(rawNum, rawName) {
    const n = parseInt(str_(rawNum), 10);
    if (!isNaN(n) && n >= 1 && n <= stages.length) return n;
    const text = norm_(rawName);
    if (!text) return null;
    if (stageNameToNum[text]) return stageNameToNum[text];
    const m = text.match(/stage\s*(\d+)/i);
    if (m) return parseInt(m[1], 10);
    for (const s in stageNameToNum) {
      if (text.includes(s) || s.includes(text)) return stageNameToNum[s];
    }
    return null;
  }

  function resolveId_(rawId, rawName) {
    const id = str_(rawId);
    if (id && knownIds.indexOf(id) !== -1) return id;
    const name = normName_(rawName);
    if (name && nameToId[name]) return nameToId[name];
    if (id) {
      const exact = knownIds.find(x => norm_(x) === norm_(id));
      if (exact) return exact;
    }
    return null;
  }

  function richLink_(rowIndex, colIndex) {
    if (colIndex === -1) return null;
    try {
      const rich = sheet.getRange(rowIndex + 1, colIndex + 1).getRichTextValue();
      return rich ? rich.getLinkUrl() : null;
    } catch (e) { return null; }
  }

  const documents = {};
  for (let r = headerIdx + 1; r < values.length; r++) {
    const row = values[r];
    const document = str_(row[colDoc]);
    if (!document) continue;

    const id = resolveId_(colId === -1 ? '' : row[colId], colName === -1 ? '' : row[colName]);
    if (!id) {
      warnings.push(`Documents row ${r + 1}: could not match Project ID/Product to the Products list.`);
      continue;
    }

    const stage = resolveStage_(colStageNum === -1 ? '' : row[colStageNum], colStage === -1 ? '' : row[colStage]);
    if (!stage) {
      warnings.push(`Documents row ${r + 1}: could not resolve stage for document "${document}".`);
      continue;
    }

    const linkCell = colLink === -1 ? '' : row[colLink];
    let link = str_(linkCell) || null;
    if (!link) link = richLink_(r, colLink);

    if (!documents[id]) documents[id] = [];
    documents[id].push({
      stage: stage,
      document: document,
      plannedStart: colStart === -1 ? null : dateStr_(row[colStart]),
      dueDate: colDue === -1 ? null : dateStr_(row[colDue]),
      completedDate: colCompleted === -1 ? null : dateStr_(row[colCompleted]),
      status: colStatus === -1 ? null : (str_(row[colStatus]) || null),
      link: link
    });
  }

  Object.keys(documents).forEach(id => {
    const seen = {};
    documents[id] = documents[id].filter(doc => {
      const key = `${doc.stage}|${doc.document}|${doc.link || ''}`;
      if (seen[key]) return false;
      seen[key] = true;
      return true;
    });
  });

  return { found: true, documents: documents };
}
'''
              code = code.replace("\nfunction buildPayload_() {", "\n" + fn + "\nfunction buildPayload_() {", 1)

          merge_marker = "\n  if (!anyOwnerTabFound) warnings.push('None of the expected owner tabs were found — no milestones/blockers/next steps/documents will show for any variant.');"
          if 'readDocumentsSheet_(ss, stages, products, warnings)' not in code:
              merge = r'''

  // Documents sheet is the authoritative source for document names/links.
  // Owner tabs continue to provide engineering/status roll-ups.
  const documentSource = readDocumentsSheet_(ss, stages, products, warnings);
  if (documentSource.found) {
    Object.keys(documents).forEach(id => delete documents[id]);
    Object.keys(documentSource.documents).forEach(id => {
      documents[id] = documentSource.documents[id];
    });
  }
'''
              if merge_marker not in code:
                  raise SystemExit('Could not find buildPayload merge marker')
              code = code.replace(merge_marker, merge + merge_marker, 1)

          cp.write_text(code, encoding='utf-8')

          dp = Path('dashboard.html')
          dash = dp.read_text(encoding='utf-8')
          marker = '/* DOCUMENTS SHEET LIVE SOURCE PATCH */'
          if marker not in dash:
              css = r'''<style>
/* DOCUMENTS SHEET LIVE SOURCE PATCH */
.doc-row .doc-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.doc-row .doc-actions a{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:10.5px;font-weight:600;text-decoration:none;}
.doc-row .doc-actions a.download{color:var(--teal);}
.doc-row .doc-actions a.open{color:var(--sub);}
</style>'''
              js = r'''<script>
/* DOCUMENTS SHEET LIVE SOURCE PATCH */
(function(){
  function esc_(v){
    return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function stageDocsFromData_(productId, stageNo){
    const all = (DATA.documents && DATA.documents[productId]) || [];
    return all.filter(x => Number(x.stage) === Number(stageNo) && (x.document || x.documentName || x.name));
  }
  function docDownloadUrl_(url){
    if(!url) return '';
    const s = String(url);
    const m1 = s.match(/drive\.google\.com\/file\/d\/([^/]+)/i);
    const m2 = s.match(/[?&]id=([^&]+)/i);
    const id = m1 ? m1[1] : m2 ? m2[1] : null;
    return id ? 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(id) : s;
  }
  function refreshDocuments_(){
    if(!window.selectedProduct || !window.expandedStage) return;
    const docs = stageDocsFromData_(window.selectedProduct, window.expandedStage);
    if(!docs.length) return;
    const panel = document.getElementById('detail');
    if(!panel) return;
    const rows = Array.from(panel.querySelectorAll('.stage-row'));
    const row = rows.find(r => { const n = r.querySelector('.stage-num'); return n && Number(n.textContent.trim()) === Number(window.expandedStage); });
    if(!row) return;
    const detail = row.nextElementSibling;
    const inner = detail && detail.querySelector('.stage-detail-inner');
    if(!inner) return;
    let section = inner.querySelector('.doc-section');
    if(!section){ section = document.createElement('div'); section.className = 'doc-section'; inner.appendChild(section); }
    const html = docs.map(d => {
      const name = d.document || d.documentName || d.name || 'Document';
      const status = d.status || 'Available';
      const link = d.link || d.url || d.documentLink || '';
      const dl = docDownloadUrl_(link);
      const cls = /complet/i.test(status) ? 'ready' : /progress|track|revision/i.test(status) ? 'progress' : 'notstarted';
      const actions = link ? `<div class="doc-actions"><a class="open" href="${esc_(link)}" target="_blank" onclick="event.stopPropagation()">Open ↗</a><a class="download" href="${esc_(dl)}" target="_blank" download onclick="event.stopPropagation()">Download ↓</a></div>` : '';
      return `<div class="doc-row"><span>${esc_(name)}</span><div style="display:flex;align-items:center;gap:8px;"><span class="doc-status ${cls}">${esc_(status)}</span>${actions}</div></div>`;
    }).join('');
    section.innerHTML = `<div class="k">Documents</div>${html}`;
  }
  function install_(){
    if(typeof window.renderDetail !== 'function' || window.__documentsPatchInstalled) return;
    const original = window.renderDetail;
    window.renderDetail = function(){ original(); setTimeout(refreshDocuments_, 0); };
    window.__documentsPatchInstalled = true;
    setTimeout(refreshDocuments_, 0);
  }
  const timer = setInterval(function(){ install_(); if(window.__documentsPatchInstalled) clearInterval(timer); }, 100);
})();
</script>'''
              dash = dash.replace('</head>', css + '\n</head>', 1)
              dash = dash.replace('</body>', js + '\n</body>', 1)
          dp.write_text(dash, encoding='utf-8')

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Code.gs dashboard.html
          git commit -m 'Use Documents sheet as live document source' || exit 0
          git push
