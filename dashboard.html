<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDM & PM Tracker</title>
<base target="_blank">
<style>
:root{--bg:#f5f8fc;--panel:#fff;--line:#dee6f0;--text:#182338;--sub:#5c6b84;--mute:#8b98ae;--teal:#0e9c8c;--amber:#c97a0a;--red:#d93636}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:28px}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}.brand{font-size:23px;font-weight:700}.brand span{color:var(--teal)}.sub{color:var(--sub);font-size:13px;margin-top:5px}.sync{font:11px monospace;color:var(--mute);margin-top:6px}.btns{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:8px;cursor:pointer;color:var(--text)}button:hover{border-color:var(--teal)}
.banner{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-bottom:22px}.ok{color:var(--teal);background:#effaf8}.err{color:var(--red);background:#fff3f3}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--sub);margin:18px 0 10px}.cats,.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}.card:hover,.card.sel{border-color:var(--teal);background:#f8fbfc}.catname,.pname{font-weight:700}.meta{font-size:11px;color:var(--mute);margin-top:4px}.bar{height:5px;background:#e6ecf3;border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.pct{font-size:12px;color:var(--sub);margin-top:5px}
.detail{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.dhead{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:15px}.dname{font-size:20px;font-weight:700}.big{font-size:27px;font-weight:700;color:var(--teal)}.stage{border:1px solid var(--line);border-radius:8px;margin:7px 0;overflow:hidden}.srow{display:flex;align-items:center;gap:10px;padding:10px;cursor:pointer}.num{width:25px;height:25px;border-radius:50%;background:#e8edf4;color:var(--mute);display:grid;place-items:center;font-size:11px}.done .num{background:var(--teal);color:#fff}.current .num{background:var(--amber);color:#fff}.sname{flex:1}.status{font-size:10px;font-weight:700;padding:4px 8px;border-radius:5px;background:#eef1f5;color:var(--mute)}.done .status{color:var(--teal);background:#eaf8f5}.current .status{color:var(--amber);background:#fff5e7}.body{display:none;padding:12px 15px 15px 45px;background:#fafbfd;border-top:1px solid var(--line)}.stage.open .body{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field b{display:block;font-size:10px;text-transform:uppercase;color:var(--mute);margin-bottom:3px}.blocker{padding:9px;background:#fff0f0;border:1px solid #f1c4c4;border-radius:7px;color:var(--red);margin-top:10px}.next{padding:9px;background:#fff7eb;border:1px solid #f0d3a4;border-radius:7px;margin-top:10px}.docs{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}.doc{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;margin-top:6px;background:#f7f9fc;border:1px solid var(--line);border-radius:6px}.doc a{color:var(--teal);text-decoration:none;font-weight:600;font-size:11px}.muted{color:var(--mute);font-size:12px}.blockers{margin-bottom:22px}.blockerrow{display:grid;grid-template-columns:90px 1fr 120px 70px;gap:10px;padding:9px;border:1px solid #f1d1d1;border-left:3px solid var(--red);background:#fff;border-radius:6px;margin-top:6px;cursor:pointer}.footer{text-align:center;color:var(--mute);font-size:11px;margin:25px}.hidden{display:none}@media(max-width:700px){.wrap{padding:18px}.top,.dhead{flex-direction:column}.blockerrow{grid-template-columns:1fr}.doc{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">PDM <span>&</span> PM Tracker</div>
      <div class="sub">Product development pipeline — live Google Sheet view</div>
      <div id="sync" class="sync">Connecting to Google Sheet…</div>
    </div>
    <div class="btns">
      <button onclick="loadLive()">Refresh</button>
      <button onclick="downloadCSV()">Download CSV</button>
      <button onclick="showJson()">API JSON</button>
    </div>
  </div>
  <div id="banner" class="banner">Loading live data…</div>
  <div id="blockers" class="blockers"></div>
  <div class="label">Product lines — click to view variants</div>
  <div id="cats" class="cats"></div>
  <div class="label" id="productsLabel">Variants</div>
  <div id="products" class="products"></div>
  <div id="detail" class="detail hidden"></div>
  <div class="footer">Stage 1–5: PDM owns solo · Stage 6+: PDM + PM jointly · Click a stage to see tracker fields and documents</div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxo59j_9qO_jzoljBlb4ZFrL6RZyXxzOe8c8MCt5wX13DyEKh6ye02N7IcSgky2rOl6/exec';
const FALLBACK='data.json';
let DATA={success:true,products:[],projects:[],engineering:{},documents:{},stages:[]};
let selectedCat='',selectedId='',openStage=null;
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const stages=()=>Array.isArray(DATA.stages)?DATA.stages.map(x=>typeof x==='string'?x:x.name).filter(Boolean):[];
function pct(p){return Math.max(0,Math.min(100,Number(p.progressPct??p.progress??0)))}
function products(){return Array.isArray(DATA.products)?DATA.products:[]}
function cats(){return [...new Set(products().map(p=>p.cat||p.category||'Project').filter(Boolean))]}
function normalizePayload(x){
  if(x&&x.data)x=x.data;if(!x)throw Error('Empty API response');
  if(!Array.isArray(x.products)&&Array.isArray(x.projects)){
    const defs=Array.isArray(x.stages)?x.stages:[],eng={},docs={};
    x.products=x.projects.map(p=>{const ss=p.stages||[],cur=ss[(Number(p.currentStage)||1)-1]||{};eng[p.projectId]={};docs[p.projectId]=[];
      ss.forEach(s=>{eng[p.projectId][s.stageNumber]={stageNumber:s.stageNumber,stageName:s.stageName,owner:s.owner,plannedStart:s.plannedStart,dueDate:s.dueDate,completedDate:s.completedDate,status:s.status,milestone:s.keyMilestones,blocker:s.blocker,nextStep:s.immediateNextStep,remarks:s.remarks,documents:s.documents||[]};(s.documents||[]).forEach(d=>docs[p.projectId].push({productId:p.projectId,projectId:p.projectId,stage:s.stageNumber,stageNumber:s.stageNumber,document:d.name,documentName:d.name,name:d.name,link:d.link,url:d.link,documentLink:d.link,status:d.status,remarks:d.remarks}))});
      return{id:p.projectId,projectId:p.projectId,name:p.projectName||p.projectId,projectName:p.projectName||p.projectId,cat:p.category||'Project',category:p.category||'Project',pdm:cur.owner||'',pm:'',stage:Number(p.currentStage)||1,currentStage:Number(p.currentStage)||1,currentStageName:p.currentStageName||cur.stageName||'',progress:p.progressPct??p.progress??0,progressPct:p.progressPct??p.progress??0,completedStages:p.completedStages||0,totalStages:p.totalStages||defs.length||10,status:cur.status||'Not Started',blocker:cur.blocker||'',plannedStart:cur.plannedStart||'',dueDate:cur.dueDate||'',completedDate:cur.completedDate||''};
    });
    x.engineering=eng;x.documents=docs;x.stageDocs=docs;if(!Array.isArray(x.stages)||!x.stages.length)x.stages=defs.map(s=>typeof s==='string'?s:s.name);
  }
  if(!Array.isArray(x.products))throw Error('API response has no products/projects array');
  x.stages=(x.stages||[]).map(s=>typeof s==='string'?s:s.name).filter(Boolean);if(!x.stages.length)x.stages=['Market Research','Proposal','Commercial Finalization','Statement of Work (SOW)','Project Kickoff','Project Planning','Detailed Design','Critical Design Review (CDR)','Procurement & Development','Integration, Verification & Validation'];
  x.engineering=x.engineering||{};x.documents=x.documents||{};return x;
}
function currentStage(p){return Math.max(1,Math.min(stages().length||10,Number(p.currentStage||p.stage||1)))}
function render(){
  const ps=products();if(!selectedCat||!cats().includes(selectedCat))selectedCat=cats()[0]||'';if(selectedId&&!ps.some(p=>p.id===selectedId))selectedId='';
  document.getElementById('cats').innerHTML=cats().map(c=>{const a=ps.filter(p=>(p.cat||p.category||'Project')===c),av=a.length?Math.round(a.reduce((s,p)=>s+pct(p),0)/a.length):0;return`<div class="card ${c===selectedCat?'sel':''}" onclick="selectCat('${esc(c)}')"><div class="catname">${esc(c)}</div><div class="meta">${a.length} variant${a.length===1?'':'s'}</div><div class="bar"><i style="width:${av}%"></i></div><div class="pct">${av}% average progress</div></div>`}).join('');
  const list=ps.filter(p=>(p.cat||p.category||'Project')===selectedCat);document.getElementById('productsLabel').textContent=(selectedCat||'Variants')+' — variants';
  document.getElementById('products').innerHTML=list.map(p=>`<div class="card ${p.id===selectedId?'sel':''}" onclick="selectProduct('${esc(p.id)}')"><div class="pname">${esc(p.name||p.projectName||p.id)}</div><div class="meta">${esc(p.id)} · Stage ${currentStage(p)}/${stages().length}</div><div class="bar"><i style="width:${pct(p)}%"></i></div><div class="pct">${pct(p)}% · ${esc(p.currentStageName||'')}</div></div>`).join('');
  renderBlockers();renderDetail();
}
function renderBlockers(){const rows=[];products().forEach(p=>{const e=(DATA.engineering[p.id]||{})[currentStage(p)];if(e&&e.blocker)rows.push({p,e})});const el=document.getElementById('blockers');if(!rows.length){el.innerHTML='<div class="banner ok">✓ No open blockers across the portfolio.</div>';return}el.innerHTML='<div class="label">Open blockers</div>'+rows.map(r=>`<div class="blockerrow" onclick="selectProduct('${esc(r.p.id)}');openStage=${currentStage(r.p)};renderDetail()"><b>${esc(r.p.id)}</b><span>${esc(r.e.blocker)}</span><span>${esc(r.e.owner||r.p.pdm||'—')}</span><span>Stage ${currentStage(r.p)}</span></div>`).join('')}
function docsFor(id,n){const all=Array.isArray(DATA.documents[id])?DATA.documents[id]:[];return all.filter(d=>Number(d.stage??d.stageNumber??0)===Number(n))}
function renderDetail(){
  const el=document.getElementById('detail');if(!selectedId){el.classList.add('hidden');el.innerHTML='';return}const p=products().find(x=>x.id===selectedId);if(!p)return;el.classList.remove('hidden');const ss=stages(),cur=currentStage(p),eng=DATA.engineering[p.id]||{};
  let html=`<div class="dhead"><div><div class="dname">${esc(p.name||p.id)}</div><div class="meta">${esc(p.id)} · ${esc(p.cat||p.category||'Project')} · ${esc(p.currentStageName||ss[cur-1]||'')}</div></div><div><div class="big">${pct(p)}%</div><div class="meta">${p.completedStages||0}/${p.totalStages||ss.length} completed</div></div></div>`;
  html+=ss.map((name,i)=>{const n=i+1,e=eng[n]||{},done=e.status==='Completed'||!!e.completedDate||(n<cur&&!e.status),active=n===cur&&!done,cls=done?'done':active?'current':'',status=done?'Completed':active?(e.status||'In Progress'):'Not Started',docs=docsFor(p.id,n);
    const body=`<div class="grid">${e.owner?`<div class="field"><b>Owner</b>${esc(e.owner)}</div>`:''}${e.plannedStart?`<div class="field"><b>Planned Start</b>${esc(e.plannedStart)}</div>`:''}${e.dueDate?`<div class="field"><b>Due Date</b>${esc(e.dueDate)}</div>`:''}${e.completedDate?`<div class="field"><b>Completed Date</b>${esc(e.completedDate)}</div>`:''}${e.status?`<div class="field"><b>Status</b>${esc(e.status)}</div>`:''}</div>${e.milestone?`<div class="next"><b>Key Milestones</b><br>${esc(e.milestone)}</div>`:''}${e.nextStep?`<div class="next"><b>Immediate Next Step</b><br>${esc(e.nextStep)}</div>`:''}${e.blocker?`<div class="blocker"><b>Blocker</b><br>${esc(e.blocker)}</div>`:''}${e.remarks?`<div class="muted" style="margin-top:9px"><b>Remarks:</b> ${esc(e.remarks)}</div>`:''}<div class="docs"><b>Documents (${docs.length})</b>${docs.length?docs.map(d=>{const link=d.link||d.url||d.documentLink||'',name=d.name||d.documentName||d.document||'Document';return`<div class="doc"><span>${esc(name)} <span class="muted">(${esc(d.status||'Not Uploaded')})</span></span>${/^https?:\/\//i.test(link)?`<a href="${esc(link)}">Open ↗</a>`:'<span class="muted">No link</span>'}</div>`}).join(''):'<div class="muted" style="margin-top:6px">No documents for this stage.</div>'}</div>`;
    return`<div class="stage ${cls} ${openStage===n?'open':''}"><div class="srow" onclick="openStage=openStage===${n}?null:${n};renderDetail()"><div class="num">${n}</div><div class="sname"><b>${esc(name)}</b><div class="meta">${esc(e.owner||'')}</div></div><div class="status">${esc(status)}</div><div>›</div></div><div class="body">${body}</div></div>`;
  }).join('');el.innerHTML=html;
}
function selectCat(c){selectedCat=c;selectedId='';openStage=null;render()}function selectProduct(id){selectedId=id;openStage=null;render()}
async function loadLive(){const sync=document.getElementById('sync'),banner=document.getElementById('banner');sync.textContent='Connecting to Google Sheet…';banner.className='banner';banner.textContent='Loading live data…';try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);DATA=normalizePayload(await r.json());render();sync.textContent='Live — Google Sheet synced '+(DATA.generatedAt?new Date(DATA.generatedAt).toLocaleString('en-IN'):'just now');banner.className='banner ok';banner.textContent='✓ Live data loaded — '+products().length+' project(s) from Tracker.'}catch(e){console.error(e);try{const r=await fetch(FALLBACK+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Fallback HTTP '+r.status);DATA=normalizePayload(await r.json());render();sync.textContent='Live unavailable — showing data.json fallback';banner.className='banner err';banner.textContent='Live API unavailable. Showing fallback data.json.'}catch(e2){sync.textContent='Live sync unavailable';banner.className='banner err';banner.textContent='✕ '+e.message}}}
function downloadCSV(){const ps=products();if(!ps.length){alert('No live project data available.');return}const keys=['id','projectId','name','cat','stage','currentStage','currentStageName','progressPct','status','blocker','plannedStart','dueDate','completedDate'];const ec=v=>`"${String(v??'').replace(/"/g,'""')}"`;const out=[keys.map(ec).join(',')].concat(ps.map(p=>keys.map(k=>ec(p[k])).join(','))).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out],{type:'text/csv'}));a.download='PDM-PM-Live-Tracker.csv';a.click()}
function showJson(){const w=window.open();w.document.write('<pre style="white-space:pre-wrap">'+esc(JSON.stringify(DATA,null,2))+'</pre>')}
loadLive();setInterval(loadLive,5*60*1000);
</script>

<!-- LIVE GOOGLE SHEET CONNECTOR START -->
<script>
(function(){
  const LIVE_API_URL = 'https://script.google.com/macros/s/AKfycby2rAwDYj8bzK5Vgyn2PniZBmuOMoarqR6IRttoESPtR6CTDbvgR3fLWeXwWIXvaDeA/exec';

  function normalizeLiveStageProgress(live){
    const total = Number(STAGES.length || 10);
    const engineering = live.engineering || {};
    const products = Array.isArray(live.products) ? live.products : [];

    products.forEach(function(p){
      const eng = engineering[p.id] || {};
      const stageNums = Object.keys(eng)
        .map(Number)
        .filter(function(n){ return Number.isFinite(n) && n >= 1 && n <= total; })
        .sort(function(a,b){ return a-b; });

      if(!stageNums.length){
        const fallback = Math.max(1, Math.min(total, Number(p.currentStage || p.stage || 1)));
        p.currentStage = fallback;
        p.stage = fallback;
        p.currentStageName = STAGES[fallback - 1] || ('Stage ' + fallback);
        p.progressPct = Math.round((fallback / total) * 100);
        return;
      }

      const active = stageNums.filter(function(n){
        const e = eng[n] || {};
        const ratio = Number(e.completionRatio);
        const totalCount = Number(e.totalCount || 0);
        const completedCount = Number(e.completedCount || 0);
        const status = String(e.status || '').trim().toLowerCase();
        const completed =
          (totalCount > 0 && completedCount >= totalCount) ||
          ratio >= 1 ||
          /completed|complete|closed|approved/.test(status);
        return !completed;
      });

      let current;
      if(active.length){
        // Highest stage with real tracker data that is not complete.
        // Empty stages are ignored completely.
        current = Math.max.apply(null, active);
      }else{
        // If every populated stage is complete, advance to the next stage.
        current = Math.min(Math.max.apply(null, stageNums) + 1, total);
      }

      p.currentStage = current;
      p.stage = current;
      p.currentStageName = STAGES[current - 1] || ('Stage ' + current);

      // Stage 6 in progress = 60%; Stage 5 in progress = 50%.
      // Empty stages do not affect this calculation.
      p.progressPct = Math.round((current / total) * 100);
    });
  }

  async function refreshLive(){
    try{
      const response = await fetch(LIVE_API_URL + '?t=' + Date.now(), {cache:'no-store'});
      if(!response.ok) throw new Error('HTTP ' + response.status);
      const live = await response.json();
      if(!live || !Array.isArray(live.products)) throw new Error('Invalid API response');

      DATA = live;
      STAGES = Array.isArray(live.stages) ? live.stages : [];
      TOTAL_STAGES = STAGES.length;

      normalizeLiveStageProgress(live);

      if(typeof rebuildTemplates === 'function') rebuildTemplates();
      if(typeof renderRollup === 'function') renderRollup();
      if(typeof renderCatStrip === 'function') renderCatStrip();
      if(typeof renderVariants === 'function') renderVariants();
      if(typeof renderDetail === 'function') renderDetail();

      const note = document.getElementById('syncNote');
      if(note) note.textContent = 'Live — Google Sheet synced ' + (live.generatedAt ? new Date(live.generatedAt).toLocaleString('en-IN') : 'just now');
      console.log('PDM-PM live sync successful', live.products.length, 'projects');
    }catch(error){
      console.error('PDM-PM live sync failed', error);
      const note = document.getElementById('syncNote');
      if(note) note.textContent = 'Live sync unavailable — showing last loaded data';
    }
  }

  window.refreshPdmPmDashboard = refreshLive;
  refreshLive();
  setInterval(refreshLive, 5 * 60 * 1000);
})();
</script>
<!-- LIVE GOOGLE SHEET CONNECTOR END -->
</body>
</html>
