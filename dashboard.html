<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDM & PM Tracker</title>
<style>
:root{--bg:#f5f7f9;--panel:#fff;--panel2:#f0f4f8;--line:#dfe6ef;--text:#182338;--sub:#5c6b84;--mute:#8b98ae;--teal:#0e9c8c;--amber:#c97a0a;--red:#d93636}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1280px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}h1{font-size:24px;margin:0 0 5px}.sub{color:var(--sub);font-size:13px}.sync{font-size:11px;color:var(--mute);margin-top:7px}button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 13px;cursor:pointer}button:hover{border-color:var(--teal)}.notice{padding:10px 13px;border-radius:8px;background:#fff;border:1px solid var(--line);margin-bottom:18px;font-size:12px}.notice.err{border-color:#efb1b1;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px}.card .k{font-size:11px;color:var(--sub);text-transform:uppercase}.card .v{font-size:24px;font-weight:700;margin-top:5px}.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:20px}.project{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px;cursor:pointer}.project:hover,.project.active{border-color:var(--teal);background:var(--panel2)}.pid{font-weight:700}.pct{font-size:22px;font-weight:700;color:var(--teal);margin-top:8px}.meta{font-size:11px;color:var(--sub);margin-top:4px}.bar{height:6px;background:#e5eaf1;border-radius:5px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.detail{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.detail.open{display:block}.dhead{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:15px}.dname{font-size:20px;font-weight:700}.dpct{font-size:28px;color:var(--teal);font-weight:700}.stage{border:1px solid transparent;border-radius:8px;margin:5px 0}.stage-head{display:flex;align-items:center;gap:12px;padding:10px;cursor:pointer}.stage-head:hover{background:var(--panel2)}.num{width:27px;height:27px;border-radius:50%;background:#e5eaf1;color:var(--mute);display:grid;place-items:center;font-size:11px;flex:none}.num.done{background:var(--teal);color:#fff}.num.current{background:var(--amber);color:#fff}.stage-main{flex:1}.stage-name{font-weight:600;font-size:13px}.stage-owner{font-size:11px;color:var(--mute);margin-top:2px}.status{font-size:11px;padding:4px 8px;border-radius:5px;font-weight:700}.status.done{color:var(--teal);background:#e4f7f4}.status.current{color:var(--amber);background:#fff1dc}.status.other{color:var(--mute);background:#f0f2f5}.stage-body{display:none;padding:5px 45px 15px}.stage.open{border-color:var(--line);background:#fbfcfd}.stage.open .stage-body{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field{margin-bottom:10px}.field b{display:block;font-size:10px;text-transform:uppercase;color:var(--mute);margin-bottom:3px}.field span{font-size:12px;white-space:pre-wrap}.blocker{padding:9px;background:#fff0f0;border:1px solid #f0c0c0;border-radius:6px;color:var(--red);font-size:12px;margin:7px 0}.next{padding:9px;background:#eef8f7;border:1px solid #c9e9e5;border-radius:6px;font-size:12px;margin:7px 0}.docs{margin-top:12px}.doc{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin:5px 0;font-size:12px}.doc a{color:#245bc6;text-decoration:none}.muted{color:var(--mute)}@media(max-width:700px){.wrap{padding:16px}header,.dhead{flex-direction:column}.stage-body{padding-left:12px}.status{display:none}}
</style>
</head>
<body><div class="wrap"><header><div><h1>PDM & PM Tracker</h1><div class="sub">Project development and program management dashboard</div><div id="sync" class="sync">Loading…</div></div><div><button onclick="loadData(true)">↻ Refresh</button></div></header><div id="notice" class="notice">Loading live data from Apps Script…</div><div id="summary" class="cards"></div><div id="projects" class="projects"></div><div id="detail" class="detail"></div></div>
<script>
const LIVE_API_URL='https://script.google.com/macros/s/AKfycby2rAwDYj8bzK5Vgyn2PniZBmuOMoarqR6IRttoESPtR6CTDbvgR3fLWeXwWIXvaDeA/exec';
let DATA={success:true,generatedAt:'',projects:[],stages:[]};let selectedProject='';
async function fetchJson(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normPayload(p){if(!p||p.success===false)throw new Error(p?.error||'Invalid payload');if(p.data)p={...p,...p.data};p.projects=Array.isArray(p.projects)?p.projects:[];p.stages=Array.isArray(p.stages)?p.stages:[];return p}
async function loadData(force=false){document.getElementById('notice').className='notice';document.getElementById('notice').textContent='Loading live data from Apps Script…';try{DATA=normPayload(await fetchJson(LIVE_API_URL+(force?'?t='+Date.now():'')));render();document.getElementById('notice').textContent='Live data connected to Google Sheets.'}catch(e){console.error(e);try{DATA=normPayload(await fetchJson('./data.json?t='+Date.now()));render();document.getElementById('notice').textContent='Apps Script unavailable — showing data.json fallback.'}catch(e2){document.getElementById('notice').className='notice err';document.getElementById('notice').textContent='Unable to load Apps Script or data.json: '+e.message}}}
function render(){const ps=DATA.projects,total=ps.length,completed=ps.reduce((n,p)=>n+(p.completedStages||0),0),avg=total?Math.round(ps.reduce((n,p)=>n+(p.progress||0),0)/total):0,blocked=ps.reduce((n,p)=>n+(p.stages||[]).filter(s=>s.status==='Blocked').length,0);document.getElementById('sync').textContent='Last generated: '+(DATA.generatedAt?new Date(DATA.generatedAt).toLocaleString():'—');document.getElementById('summary').innerHTML=[['Projects',total],['Average Progress',avg+'%'],['Completed Stages',completed],['Blocked Stages',blocked]].map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');document.getElementById('projects').innerHTML=ps.length?ps.map(p=>`<div class="project ${selectedProject===p.projectId?'active':''}" onclick="openProject('${esc(p.projectId)}')"><div class="pid">${esc(p.projectId)}</div><div class="pct">${p.progress||0}%</div><div class="meta">Current: Stage ${p.currentStage||1} — ${esc(p.currentStageName||'')}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,p.progress||0))}%"></i></div></div>`).join(''):'<div class="notice">No projects found in Tracker.</div>';if(selectedProject){const p=ps.find(x=>x.projectId===selectedProject);if(p)renderDetail(p);else selectedProject=''}}
function openProject(id){selectedProject=id;render()}
function renderDetail(p){const stages=Array.isArray(p.stages)?p.stages:[],blocked=stages.filter(s=>s.status==='Blocked');document.getElementById('detail').className='detail open';document.getElementById('detail').innerHTML=`<div class="dhead"><div><div class="dname">${esc(p.projectId)}</div><div class="sub">Current Stage ${p.currentStage||1}: ${esc(p.currentStageName||'')}</div></div><div><div class="dpct">${p.progress||0}%</div><div class="sub">${p.completedStages||0} / ${p.totalStages||10} stages completed</div></div></div>${blocked.map(s=>`<div class="blocker"><b>Blocked — Stage ${s.stageNumber}: ${esc(s.stageName)}</b><br>${esc(s.blocker||'No blocker description')}</div>`).join('')}${stages.map(s=>stageHtml(s,p.currentStage)).join('')}`}
function stageHtml(s,current){const st=s.status||'Not Started',cls=st==='Completed'?'done':s.stageNumber===current?'current':'',statusCls=st==='Completed'?'done':s.stageNumber===current?'current':'other',docs=(s.documents||[]).map(d=>`<div class="doc"><span><b>${esc(d.name||'Document')}</b> <span class="muted">${esc(d.status||'')}</span>${d.remarks?'<br>'+esc(d.remarks):''}</span>${d.link?`<a href="${esc(d.link)}" target="_blank" rel="noopener">Open</a>`:''}</div>`).join('');return `<div class="stage" onclick="this.classList.toggle('open')"><div class="stage-head"><div class="num ${cls}">${s.stageNumber}</div><div class="stage-main"><div class="stage-name">${esc(s.stageName)}</div><div class="stage-owner">${esc(s.owner||'Owner not assigned')}</div></div><span class="status ${statusCls}">${esc(st)}</span><span>›</span></div><div class="stage-body"><div class="grid"><div class="field"><b>Planned Start</b><span>${esc(s.plannedStart||'—')}</span></div><div class="field"><b>Due Date</b><span>${esc(s.dueDate||'—')}</span></div><div class="field"><b>Completed Date</b><span>${esc(s.completedDate||'—')}</span></div><div class="field"><b>Key Milestones</b><span>${esc(s.keyMilestones||'—')}</span></div></div>${s.blocker?`<div class="blocker"><b>Blocker</b><br>${esc(s.blocker)}</div>`:''}${s.immediateNextStep?`<div class="next"><b>Immediate Next Step</b><br>${esc(s.immediateNextStep)}</div>`:''}${s.remarks?`<div class="field"><b>Remarks</b><span>${esc(s.remarks)}</span></div>`:''}${docs?`<div class="docs"><b>Documents</b>${docs}</div>`:''}</div></div>`}
loadData();
</script></body></html>
