<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDM & PM Tracker</title><base target="_blank"><style>
:root{--bg:#f5f8fc;--p:#fff;--l:#dee6f0;--t:#182338;--s:#5c6b84;--m:#8b98ae;--g:#0e9c8c;--a:#c97a0a;--r:#d93636}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Arial,sans-serif}.w{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--l);padding-bottom:18px}.brand{font-size:23px;font-weight:700}.brand i{color:var(--g);font-style:normal}.sub,.meta{color:var(--s);font-size:12px;margin-top:5px}.sync{color:var(--m);font:11px monospace;margin-top:6px}.btn{border:1px solid var(--l);background:#fff;padding:9px 13px;border-radius:7px;cursor:pointer}.banner,.card,.detail,.block{background:var(--p);border:1px solid var(--l);border-radius:10px}.banner{padding:12px 15px;margin:20px 0}.ok{color:var(--g);background:#effaf8}.err{color:var(--r);background:#fff3f3}.label{color:var(--s);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin:18px 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{padding:14px;cursor:pointer}.card:hover,.sel{border-color:var(--g);background:#f8fbfc}.name{font-weight:700}.bar{height:5px;background:#e7edf4;border-radius:4px;margin-top:10px}.bar i{display:block;height:100%;background:var(--g)}.pct{color:var(--s);font-size:11px;margin-top:5px}.block{padding:10px;margin:6px 0;border-left:3px solid var(--r);display:grid;grid-template-columns:90px 1fr 100px 70px;gap:8px}.detail{margin-top:20px;padding:20px}.dh{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding-bottom:15px;margin-bottom:15px}.big{font-size:28px;font-weight:700;color:var(--g)}.stage{border:1px solid var(--l);border-radius:8px;margin:7px 0;overflow:hidden}.sr{display:flex;gap:10px;align-items:center;padding:10px;cursor:pointer}.num{width:25px;height:25px;border-radius:50%;background:#e8edf4;color:var(--m);display:grid;place-items:center;font-size:11px}.done .num{background:var(--g);color:white}.cur .num{background:var(--a);color:white}.sn{flex:1}.st{font-size:10px;font-weight:bold;padding:4px 7px;border-radius:5px;background:#eef1f5;color:var(--m)}.done .st{color:var(--g);background:#eaf8f5}.cur .st{color:var(--a);background:#fff5e7}.body{display:none;padding:12px 15px 15px 45px;background:#fafbfd;border-top:1px solid var(--l)}.open .body{display:block}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.f b{display:block;color:var(--m);font-size:10px;text-transform:uppercase;margin-bottom:3px}.warn{margin-top:8px;padding:8px;background:#fff7eb;border:1px solid #f0d3a4;border-radius:6px}.danger{margin-top:8px;padding:8px;background:#fff0f0;border:1px solid #f1c4c4;color:var(--r);border-radius:6px}.docs{border-top:1px dashed var(--l);margin-top:10px;padding-top:10px}.doc{display:flex;justify-content:space-between;padding:7px;margin-top:5px;background:#f7f9fc;border:1px solid var(--l);border-radius:5px}.doc a{color:var(--g);text-decoration:none;font-size:11px}.foot{text-align:center;color:var(--m);font-size:11px;margin:24px}@media(max-width:700px){.w{padding:16px}.top,.dh{flex-direction:column}.block{grid-template-columns:1fr}}
</style></head><body><div class="w"><div class="top"><div><div class="brand">PDM <i>&</i> PM Tracker</div><div class="sub">Live Google Sheet project development tracker</div><div id="sync" class="sync">Connecting…</div></div><div><button class="btn" onclick="load()">Refresh</button> <button class="btn" onclick="csv()">Download CSV</button></div></div><div id="msg" class="banner">Loading…</div><div id="blocks"></div><div class="label">Product lines</div><div id="cats" class="grid"></div><div class="label" id="pl">Variants</div><div id="prods" class="grid"></div><div id="detail" class="detail" style="display:none"></div><div class="foot">Stage 1–5: PDM owns solo · Stage 6+: PDM + PM jointly</div></div><script>
const API='https://script.google.com/macros/s/AKfycbxo59j_9qO_jzoljBlb4ZFrL6RZyXxzOe8c8MCt5wX13DyEKh6ye02N7IcSgky2rOl6/exec',FALL='data.json';let D={products:[],projects:[],engineering:{},documents:{},stages:[]},cat='',pid='',open=0;const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),SS=()=>Array.isArray(D.stages)?D.stages.map(x=>typeof x==='string'?x:x.name).filter(Boolean):[],P=()=>Array.isArray(D.products)?D.products:[],pct=p=>Math.max(0,Math.min(100,Number(p.progressPct??p.progress??0)));function adapt(x){if(x?.data)x=x.data;if(!x)throw Error('Empty API response');if(!Array.isArray(x.products)&&Array.isArray(x.projects)){let en={},dc={};x.products=x.projects.map(p=>{let ss=p.stages||[],cur=ss[(p.currentStage||1)-1]||{};en[p.projectId]={};dc[p.projectId]=[];ss.forEach(s=>{en[p.projectId][s.stageNumber]={...s,milestone:s.keyMilestones,nextStep:s.immediateNextStep};(s.documents||[]).forEach(d=>dc[p.projectId].push({stage:s.stageNumber,...d}))});return{id:p.projectId,name:p.projectName||p.projectId,projectId:p.projectId,cat:p.category||'Project',category:p.category||'Project',stage:p.currentStage||1,currentStage:p.currentStage||1,currentStageName:p.currentStageName,progress:p.progressPct??p.progress??0,progressPct:p.progressPct??p.progress??0,completedStages:p.completedStages,totalStages:p.totalStages}});x.engineering=en;x.documents=dc}if(!Array.isArray(x.products))throw Error('No products/projects in API response');x.stages=(x.stages||[]).map(x=>typeof x==='string'?x:x.name).filter(Boolean);if(!x.stages.length)x.stages=['Market Research','Proposal','Commercial Finalization','Statement of Work (SOW)','Project Kickoff','Project Planning','Detailed Design','Critical Design Review (CDR)','Procurement & Development','Integration, Verification & Validation'];x.engineering=x.engineering||{};x.documents=x.documents||{};return x}function cats(){return[...new Set(P().map(p=>p.cat||p.category||'Project'))]}function stage(p){return Math.max(1,Math.min(SS().length||10,Number(p.currentStage||p.stage||1)))}function $(id){return document.getElementById(id)}function render(){let ps=P();if(!cat||!cats().includes(cat))cat=cats()[0]||'';if(pid&&!ps.some(p=>p.id===pid))pid='';$('cats').innerHTML=cats().map(c=>{let a=ps.filter(p=>(p.cat||p.category)==c),v=a.length?Math.round(a.reduce((s,p)=>s+pct(p),0)/a.length):0;return`<div class="card ${c==cat?'sel':''}" onclick="cat='${E(c)}';pid='';render()"><div class="name">${E(c)}</div><div class="meta">${a.length} variant(s)</div><div class="bar"><i style="width:${v}%"></i></div><div class="pct">${v}% average</div></div>`}).join('');let list=ps.filter(p=>(p.cat||p.category)==cat);$('pl').textContent=(cat||'Variants')+' — variants';$('prods').innerHTML=list.map(p=>`<div class="card ${p.id==pid?'sel':''}" onclick="pid='${E(p.id)}';open=0;render()"><div class="name">${E(p.name||p.projectName||p.id)}</div><div class="meta">${E(p.id)} · Stage ${stage(p)}/${SS().length}</div><div class="bar"><i style="width:${pct(p)}%"></i></div><div class="pct">${pct(p)}% · ${E(p.currentStageName||'')}</div></div>`).join('');blockers();detail()}function blockers(){let r=[];P().forEach(p=>{let e=(D.engineering[p.id]||{})[stage(p)];if(e?.blocker)r.push({p,e})});$('blocks').innerHTML=r.length?'<div class="label">Open blockers</div>'+r.map(x=>`<div class="block" onclick="pid='${E(x.p.id)}';open=${stage(x.p)};render()"><b>${E(x.p.id)}</b><span>${E(x.e.blocker)}</span><span>${E(x.e.owner||'—')}</span><span>Stage ${stage(x.p)}</span></div>`).join(''):'<div class="banner ok">✓ No open blockers across the portfolio.</div>'}function detail(){let el=$('detail');if(!pid){el.style.display='none';return}let p=P().find(x=>x.id==pid);if(!p)return;el.style.display='block';let ss=SS(),cur=stage(p),en=D.engineering[p.id]||{};let h=`<div class="dh"><div><div class="name" style="font-size:20px">${E(p.name||p.id)}</div><div class="meta">${E(p.id)} · ${E(p.cat||p.category||'Project')} · ${E(p.currentStageName||ss[cur-1]||'')}</div></div><div><div class="big">${pct(p)}%</div><div class="meta">${p.completedStages||0}/${p.totalStages||ss.length} completed</div></div></div>`;h+=ss.map((n,i)=>{let k=i+1,e=en[k]||{},done=e.status=='Completed'||!!e.completedDate||(k<cur&&!e.status),active=k==cur&&!done,cl=done?'done':active?'cur':'',st=done?'Completed':active?(e.status||'In Progress'):'Not Started',docs=(D.documents[p.id]||[]).filter(d=>Number(d.stage??d.stageNumber)==k);let b=`<div class="fields">${[['Owner',e.owner],['Planned Start',e.plannedStart],['Due Date',e.dueDate],['Completed Date',e.completedDate],['Status',e.status]].filter(x=>x[1]).map(x=>`<div class="f"><b>${x[0]}</b>${E(x[1])}</div>`).join('')}</div>${e.milestone?`<div class="warn"><b>Key Milestones</b><br>${E(e.milestone)}</div>`:''}${e.nextStep?`<div class="warn"><b>Immediate Next Step</b><br>${E(e.nextStep)}</div>`:''}${e.blocker?`<div class="danger"><b>Blocker</b><br>${E(e.blocker)}</div>`:''}<div class="docs"><b>Documents (${docs.length})</b>${docs.length?docs.map(d=>{let l=d.link||d.url||d.documentLink||'',n=d.name||d.documentName||d.document||'Document';return`<div class="doc"><span>${E(n)} <small class="meta">${E(d.status||'Not Uploaded')}</small></span>${/^https?:\/\//i.test(l)?`<a href="${E(l)}">Open ↗</a>`:'<span class="meta">No link</span>'}</div>`}).join(''):'<div class="meta">No documents for this stage.</div>'}</div>`;return`<div class="stage ${cl} ${open==k?'open':''}"><div class="sr" onclick="open=open==${k}?0:${k};detail()"><div class="num">${k}</div><div class="sn"><b>${E(n)}</b><div class="meta">${E(e.owner||'')}</div></div><div class="st">${E(st)}</div><div>›</div></div><div class="body">${b}</div></div>`}).join('');el.innerHTML=h}async function load(){let s=$('sync'),m=$('msg');s.textContent='Connecting…';m.className='banner';m.textContent='Loading live data…';try{let r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);D=adapt(await r.json());render();s.textContent='Live — Google Sheet synced '+(D.generatedAt?new Date(D.generatedAt).toLocaleString('en-IN'):'just now');m.className='banner ok';m.textContent='✓ Live data loaded — '+P().length+' project(s).'}catch(e){try{let r=await fetch(FALL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();D=adapt(await r.json());render();s.textContent='Live unavailable — fallback loaded';m.className='banner err';m.textContent='Live API unavailable; showing data.json.'}catch(x){s.textContent='Live sync unavailable';m.className='banner err';m.textContent='✕ '+e.message}}}function csv(){let ps=P();if(!ps.length)return alert('No live project data available.');let k=['id','projectId','name','cat','currentStage','currentStageName','progressPct','status','blocker','plannedStart','dueDate','completedDate'],q=v=>`"${String(v??'').replace(/"/g,'""')}"`,out=[k.map(q).join(',')].concat(ps.map(p=>k.map(x=>q(p[x])).join(','))).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out],{type:'text/csv'}));a.download='PDM-PM-Live-Tracker.csv';a.click()}load();setInterval(load,300000);
</script></body></html>
