<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDM & PM Tracker</title>
<base target="_blank">
<style>
:root{--bg:#f5f8fc;--panel:#fff;--panel2:#f0f4f8;--line:#dee6f0;--text:#182338;--sub:#5c6b84;--mute:#8b98ae;--teal:#0e9c8c;--amber:#c97a0a;--red:#d93636}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:30px 28px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-size:23px;font-weight:700}.brand i{color:var(--teal);font-style:normal}.sub{color:var(--sub);font-size:12px;margin-top:5px}.sync{color:var(--mute);font:11px monospace;margin-top:7px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 13px;border-radius:8px;cursor:pointer}.btn:hover{border-color:var(--teal);color:var(--teal)}.banner{margin:20px 0;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.ok{color:var(--teal);background:#effaf8}.err{color:var(--red);background:#fff3f3}.label{color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin:20px 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer;box-shadow:0 1px 3px rgba(24,35,56,.05)}.card:hover,.card.sel{border-color:var(--teal);background:#f8fbfc}.name{font-weight:700;font-size:14px}.meta{color:var(--sub);font-size:11px;margin-top:3px}.bar{height:5px;background:#e7edf4;border-radius:4px;margin-top:11px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.pct{color:var(--sub);font-size:11px;margin-top:5px}.variant{position:relative}.variant .stage{font-size:11px;color:var(--sub);margin-top:9px}.badge{position:absolute;right:0;top:0;background:#fff3df;color:var(--amber);font-size:9px;font-weight:700;padding:4px 7px;border-radius:0 9px 0 7px}.blockers{margin-top:4px}.blocker{display:grid;grid-template-columns:85px 1fr 120px 70px;gap:10px;align-items:center;padding:9px 11px;margin:6px 0;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:7px;cursor:pointer;font-size:12px}.blocker .id{font:11px monospace;color:var(--mute);font-weight:700}.blocker .owner{color:var(--sub)}.blocker .age{text-align:right;color:var(--red);font-weight:700}.detail{display:none;margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:23px;box-shadow:0 2px 8px rgba(24,35,56,.06)}.detail.open{display:block}.dhead{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}.dname{font-size:20px;font-weight:700}.people{display:flex;gap:25px;flex-wrap:wrap;margin-top:10px;font-size:12px}.people span{display:block;color:var(--mute);font-size:9px;text-transform:uppercase;margin-bottom:2px}.stats{text-align:right}.big{font-size:29px;font-weight:700;color:var(--teal)}.stage-row{border:1px solid var(--line);border-radius:8px;margin:7px 0;overflow:hidden}.stage-head{display:flex;align-items:center;gap:10px;padding:10px;cursor:pointer}.num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#e8edf4;color:var(--mute);font-size:11px;font-weight:700;flex-shrink:0}.done .num{background:var(--teal);color:#fff}.current .num{background:var(--amber);color:#fff}.stage-title{flex:1;font-size:13px;font-weight:600}.stage-owner{font-size:10px;color:var(--mute);margin-top:2px}.status{font-size:10px;font-weight:700;padding:4px 8px;border-radius:5px;background:#eef1f5;color:var(--mute)}.done .status{color:var(--teal);background:#eaf8f5}.current .status{color:var(--amber);background:#fff5e7}.stage-body{display:none;padding:13px 15px 15px 47px;background:#fafbfd;border-top:1px solid var(--line)}.open .stage-body{display:block}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.field b{display:block;color:var(--mute);font-size:9px;text-transform:uppercase;margin-bottom:3px}.box{padding:8px 10px;margin-top:8px;border-radius:6px;font-size:12px;line-height:1.4}.milestone{background:#effaf8;border:1px solid #b9e8e0}.blockbox{background:#fff0f0;border:1px solid #f0b5b5;color:var(--red)}.next{background:#fff7eb;border:1px solid #f0d19a}.docs{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}.doc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 9px;margin-top:5px;background:#f7f9fc;border:1px solid var(--line);border-radius:5px;font-size:11px}.doc a{color:var(--teal);text-decoration:none}.empty{color:var(--mute);font-size:11px}.footer{text-align:center;color:var(--mute);font-size:11px;margin-top:22px}@media(max-width:700px){.wrap{padding:18px 14px 40px}.blocker{grid-template-columns:1fr}.blocker .age{text-align:left}.stats{text-align:left}.stage-head{gap:7px}.status{font-size:9px}.stage-body{padding-left:14px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="brand">PDM <i>&</i> PM Tracker</div><div class="sub">Product development pipeline — live tracker</div><div id="sync" class="sync">Connecting to Google Sheet…</div></div><div class="buttons"><button class="btn" onclick="loadLive()">↻ Refresh data</button><button class="btn" onclick="downloadCSV()">Download CSV</button></div></div>
<div id="message" class="banner">Loading live data…</div>
<div id="blockers" class="blockers"></div>
<div class="label">Product lines — click to view variants</div><div id="cats" class="grid"></div>
<div class="label" id="variantLabel">Variants</div><div id="variants" class="grid"></div>
<div id="detail" class="detail"></div>
<div class="footer">Stage 1–5: PDM owns solo · Stage 6+: PDM + PM jointly · Click any stage to see tracker fields and documents</div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxo59j_9qO_jzoljBlb4ZFrL6RZyXxzOe8c8MCt5wX13DyEKh6ye02N7IcSgky2rOl6/exec';
const FALLBACK='data.json';
const STAGE_FALLBACK=['Market Research','Proposal','Commercial Finalization','Statement of Work (SOW)','Project Kickoff','Project Planning','Detailed Design','Critical Design Review (CDR)','Procurement & Development','Integration, Verification & Validation'];
let D={products:[],stages:STAGE_FALLBACK,engineering:{},documents:{},generatedAt:''},selectedCat='',selectedId='',openStage=0;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages=()=>Array.isArray(D.stages)&&D.stages.length?D.stages:STAGE_FALLBACK;
const products=()=>Array.isArray(D.products)?D.products:[];
const pct=p=>Math.max(0,Math.min(100,Number(p.progressPct??p.progress??0)));
function category(id){const s=String(id||'').toUpperCase();if(/^CAM/.test(s))return'Camera';if(/^SEN/.test(s))return'Sensor';if(/^EDGE|^EDG/.test(s))return'Edge';if(/^DRN|^DRONE/.test(s))return'Drone';if(/^VDB|^VDEL/.test(s))return'VDelibot';if(/^NVR/.test(s))return'NVR';return'Project'}
function status(v){const s=String(v||'').toLowerCase();if(/complete|closed|approved/.test(s))return'Completed';if(/progress|active|started/.test(s))return'In Progress';if(/blocked/.test(s))return'Blocked';if(/hold/.test(s))return'On Hold';return'Not Started'}
function adapt(x){if(x&&x.data)x=x.data;if(!x)throw Error('Empty API response');const names=Array.isArray(x.stages)?x.stages.map(s=>typeof s==='string'?s:(s&&s.name)||'').filter(Boolean):STAGE_FALLBACK;let ps=Array.isArray(x.projects)?x.projects:(Array.isArray(x.products)?x.products:[]);let eng={},docs={};if(Array.isArray(x.projects)){ps=ps.map(p=>{const id=String(p.projectId||p.id||'').trim();const ss=Array.isArray(p.stages)?p.stages:[];eng[id]={};docs[id]=[];let done=0,cur=0,last=0,next=0;for(let i=1;i<=names.length;i++){const s=ss[i-1]||{};const st=status(s.status);eng[id][i]={...s,status:st,milestone:s.keyMilestones||s.milestone||'',nextStep:s.immediateNextStep||s.nextStep||''};if(st==='Completed'){done++;last=i}else if(!cur&&(st==='In Progress'||st==='Blocked'||st==='On Hold'))cur=i;else if(!next&&st==='Not Started')next=i;(s.documents||[]).forEach(d=>docs[id].push({stage:i,stageNumber:i,...d}));}cur=cur||next||Math.min(last+1,names.length)||1;return{id,name:p.name||p.projectName||id,cat:p.category||category(id),pdm:p.pdm||p.owner||'',pm:p.pm||'',stage:cur,currentStage:cur,currentStageName:names[cur-1],progressPct:Math.round(done/names.length*100),completedStages:done,totalStages:names.length}})}); }else{ps=ps.map(p=>({...p,id:p.id||p.projectId,name:p.name||p.projectName||p.id,cat:p.cat||p.category||category(p.id)}));eng=x.engineering||{};docs=x.documents||{}}
return{products:ps,stages:names,engineering:eng,documents:docs,generatedAt:x.generatedAt||'',source:x.source||{}}}
function currentStage(p){return Math.max(1,Math.min(stages().length,Number(p.currentStage||p.stage||1)))}
function cats(){return[...new Set(products().map(p=>p.cat||p.category||'Project'))]}
function render(){const ps=products();if(!selectedCat||!cats().includes(selectedCat))selectedCat=cats()[0]||'';if(selectedId&&!ps.some(p=>p.id===selectedId))selectedId='';$('cats').innerHTML=cats().map(c=>{const a=ps.filter(p=>(p.cat||p.category||'Project')===c);const avg=a.length?Math.round(a.reduce((s,p)=>s+pct(p),0)/a.length):0;return`<div class="card ${c===selectedCat?'sel':''}" onclick="selectCat('${esc(c)}')"><div style="font-size:21px">${c==='Camera'?'📷':c==='Sensor'?'🔌':c==='Edge'?'🖥️':c==='Drone'?'🚁':c==='VDelibot'?'📦':c==='NVR'?'💾':'📁'}</div><div class="name">${esc(c)}</div><div class="meta">${a.length} variant${a.length===1?'':'s'}</div><div class="bar"><i style="width:${avg}%"></i></div><div class="pct">${avg}% average progress</div></div>`}).join('');const list=ps.filter(p=>(p.cat||p.category||'Project')===selectedCat);$('variantLabel').textContent=(selectedCat||'Variants')+' — variants';$('variants').innerHTML=list.map(p=>{const st=currentStage(p),e=(D.engineering[p.id]||{})[st]||{};return`<div class="card variant ${p.id===selectedId?'sel':''}" onclick="selectProduct('${esc(p.id)}')">${e.blocker?'<div class="badge">BLOCKED</div>':''}<div class="name">${esc(p.name||p.id)}</div><div class="meta">${esc(p.id)}</div><div class="stage">Stage ${st}/${stages().length} · ${esc(p.currentStageName||stages()[st-1]||'')}</div><div class="bar"><i style="width:${pct(p)}%"></i></div><div class="pct">${pct(p)}% · ${p.completedStages||0}/${p.totalStages||stages().length} completed</div></div>`}).join('');renderBlockers();renderDetail()}
function renderBlockers(){const rows=[];products().forEach(p=>{const e=(D.engineering[p.id]||{})[currentStage(p)];if(e&&e.blocker)rows.push({p,e})});$('blockers').innerHTML=rows.length?'<div class="label">Open blockers</div>'+rows.map(r=>`<div class="blocker" onclick="selectProduct('${esc(r.p.id)}',${currentStage(r.p)})"><span class="id">${esc(r.p.id)}</span><span>${esc(r.e.blocker)}</span><span class="owner">${esc(r.p.pm||r.pdm||r.e.owner||'—')}</span><span class="age">Stage ${currentStage(r.p)}</span></div>`).join(''):'<div class="banner ok">✓ No open blockers across the portfolio.</div>'}
function selectCat(c){selectedCat=c;selectedId='';openStage=0;render()}
function selectProduct(id,stageNo){selectedId=id;openStage=stageNo||0;render();setTimeout(()=>{const el=$('detail');if(el&&el.classList.contains('open'))el.scrollIntoView({behavior:'smooth',block:'start'})},50)}
function renderDetail(){const el=$('detail');if(!selectedId){el.classList.remove('open');return}const p=products().find(x=>x.id===selectedId);if(!p){el.classList.remove('open');return}el.classList.add('open');const st=currentStage(p),en=D.engineering[p.id]||{};let html=`<div class="dhead"><div><div class="dname">${esc(p.name||p.id)}</div><div class="meta">${esc(p.id)} · ${esc(p.cat||p.category||'Project')}</div><div class="people"><div><span>PDM</span>${esc(p.pdm||'—')}</div><div><span>PM / TL</span>${p.pm?esc(p.pm):'<em style="color:var(--red)">Not assigned</em>'}</div><div><span>Current Stage</span>Stage ${st} — ${esc(p.currentStageName||stages()[st-1]||'')}</div></div></div><div class="stats"><div class="big">${pct(p)}%</div><div class="meta">overall progress · ${p.completedStages||0}/${p.totalStages||stages().length} completed</div></div></div>`;html+=stages().map((name,i)=>{const n=i+1,e=en[n]||{},done=e.status==='Completed'||!!e.completedDate||(n<st&&!e.status),cur=n===st&&!done,cls=done?'done':cur?'current':'',label=done?'Completed':cur?(e.status||'In Progress'):'Not Started';const docs=(D.documents[p.id]||[]).filter(d=>Number(d.stage??d.stageNumber??0)===n);const fields=[['Owner',e.owner],['Planned Start',e.plannedStart],['Due Date',e.dueDate],['Completed Date',e.completedDate],['Status',e.status],['Remarks',e.remarks]].filter(x=>x[1]);let body=`${fields.length?'<div class="fields">'+fields.map(x=>`<div class="field"><b>${x[0]}</b>${esc(x[1])}</div>`).join('')+'</div>':''}${e.milestone?`<div class="box milestone"><b>Key Milestones</b><br>${esc(e.milestone)}</div>`:''}${e.blocker?`<div class="box blockbox"><b>Blocker</b><br>${esc(e.blocker)}</div>`:''}${e.nextStep?`<div class="box next"><b>Immediate Next Step / Action Item</b><br>${esc(e.nextStep)}</div>`:''}<div class="docs"><b>Documents (${docs.length})</b>${docs.length?docs.map(d=>{const link=d.link||d.url||d.documentLink||'';const nm=d.name||d.documentName||d.document||'Document';return`<div class="doc"><span>${esc(nm)} <small class="meta">${esc(d.status||'Not Uploaded')}</small></span>${/^https?:\/\//i.test(link)?`<a href="${esc(link)}">Open ↗</a>`:'<span class="empty">No file link</span>'}</div>`}).join(''):'<div class="empty" style="margin-top:7px">No documents uploaded for this stage yet.</div>'}</div>`;return`<div class="stage-row ${cls} ${openStage===n?'open':''}"><div class="stage-head" onclick="toggleStage(${n})"><div class="num">${n}</div><div class="stage-title">${esc(name)}<div class="stage-owner">${n<=5?'PDM':'PDM + PM'}</div></div><div class="status">${esc(label)}</div><div>›</div></div><div class="stage-body">${body}</div></div>`}).join('');el.innerHTML=html}
function toggleStage(n){openStage=openStage===n?0:n;renderDetail()}
function downloadCSV(){const ps=products();if(!ps.length){alert('No live project data available.');return}const keys=['id','name','cat','currentStage','currentStageName','progressPct','completedStages','totalStages','pdm','pm'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[keys.map(q).join(',')].concat(ps.map(p=>keys.map(k=>q(p[k])).join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='PDM-PM-Live-Tracker.csv';a.click()}
async function loadLive(){const sync=$('sync'),msg=$('message');sync.textContent='Connecting to Google Sheet…';msg.className='banner';msg.textContent='Loading live data…';try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);D=adapt(await r.json());render();sync.textContent='Live — Google Sheet synced '+(D.generatedAt?new Date(D.generatedAt).toLocaleString('en-IN'):'just now');msg.className='banner ok';msg.textContent='✓ Live data loaded — '+products().length+' project(s).'}catch(e){console.error(e);try{const r=await fetch(FALLBACK+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();D=adapt(await r.json());render();sync.textContent='Live API unavailable — fallback loaded';msg.className='banner err';msg.textContent='Live API unavailable; showing data.json.'}catch(x){sync.textContent='Live sync unavailable';msg.className='banner err';msg.textContent='✕ '+e.message}}}
loadLive();setInterval(loadLive,300000);window.refreshPdmPmDashboard=loadLive;
</script>
</body>
</html>
